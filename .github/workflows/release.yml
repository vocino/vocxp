name: release

on:
  push:
    tags:
      - "v*"
  # Dispatched at a tag by tag.yml; a tag pushed with the Actions token
  # does not fire the push trigger above on its own.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: package and release
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      - name: post changelog to discord
        if: ${{ github.ref_type == 'tag' }}
        continue-on-error: true
        env:
          WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "$WEBHOOK" ]; then echo "DISCORD_CHANGELOG_WEBHOOK is not set; skipping"; exit 0; fi
          prev=$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || true)
          if [ -n "$prev" ]; then range="${prev}..${VERSION}"; else range="$VERSION"; fi
          new_items=(); fix_items=()
          re='^(feat|fix)(\(([^)]+)\))?!?:[[:space:]]*(.+)$'
          while IFS= read -r subject; do
            if [[ "$subject" =~ $re ]]; then
              kind="${BASH_REMATCH[1]}"; scope="${BASH_REMATCH[3]}"; text="${BASH_REMATCH[4]}"
              text="${text%.}"; text="${text:0:140}"; text="${text^}"
              if [ -n "$scope" ]; then scope="${scope^}"; text="**${scope}:** ${text}"; fi
              if [ "$kind" = feat ]; then new_items+=("- $text"); else fix_items+=("- $text"); fi
            fi
          done < <(git log "$range" --pretty=tformat:%s --reverse)
          total=$(( ${#new_items[@]} + ${#fix_items[@]} ))
          if [ "$total" -eq 0 ]; then echo "no player-facing changes in $VERSION; skipping discord post"; exit 0; fi
          shown_new=(); shown_fix=(); budget=12
          for i in ${new_items[@]+"${new_items[@]}"}; do if [ "$budget" -gt 0 ]; then shown_new+=("$i"); budget=$((budget-1)); else break; fi; done
          for i in ${fix_items[@]+"${fix_items[@]}"}; do if [ "$budget" -gt 0 ]; then shown_fix+=("$i"); budget=$((budget-1)); else break; fi; done
          hidden=$(( total - ( ${#shown_new[@]} + ${#shown_fix[@]} ) ))
          msg="**VocXP ${VERSION}**"
          if [ "${#shown_new[@]}" -gt 0 ]; then msg+=$'\n\nNew'; for i in "${shown_new[@]}"; do msg+=$'\n'"$i"; done; fi
          if [ "${#shown_fix[@]}" -gt 0 ]; then msg+=$'\n\nFixed'; for i in "${shown_fix[@]}"; do msg+=$'\n'"$i"; done; fi
          if [ "$hidden" -gt 0 ]; then msg+=$'\n\n'"**+${hidden} more in the full release**"; fi
          payload=$(jq -n --arg content "$msg" --arg username "VocXP" '{content: $content, username: $username}')
          curl -sS -X POST -H "Content-Type: application/json" -d "$payload" "${WEBHOOK}&wait=true" | jq -r '"posted changelog to discord (message " + .id + ")"'
